[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; OTA-faehige Partitionstabelle (zwei App-Slots, Wechsel per Update)
board_build.partitions = min_spiffs.csv
; C3 SuperMini: serielle Ausgabe laeuft ueber den nativen USB-Anschluss
; Versionsnummer: erscheint beim Start im Terminal und als govee/version in MQTT
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPROJECT_VERSION='"1.0.0"'
; macOS-Quirk beim C3-nativen USB: RTS/DTR vom Monitor nicht anfassen
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    knolleary/PubSubClient@^2.8
